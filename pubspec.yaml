name: simba
description: "SimbA — Simbioz Active. Поиск и размещение услуг."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  google_fonts: ^8.1.0
  intl: ^0.20.2

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0
  # Прямая зависимость нужна для типов `Theme` / `ThemeLayer` —
  # фильтруем слои стиля positron, чтобы скрыть государственные
  # границы (см. `_hideAdminBoundaries` в openfreemap_view.dart).
  # Транзитивно уже подтянута через vector_map_tiles, но без явного
  # объявления Dart-анализатор запрещает импорт.
  vector_tile_renderer: ^5.2.1
  # Путь к application cache directory — используется для дискового
  # кэша тайлов OpenFreeMap (vector_map_tiles), чтобы карта не качала
  # одни и те же тайлы при каждом открытии.
  path_provider: ^2.1.4

  image_picker: ^1.2.2
  # Принудительное JPEG-сжатие через native-код (Android: libjpeg-turbo,
  # iOS: UIImage). Используется, когда image_picker не справился — например
  # с большими PNG/HEIC, или когда галерея вернула RAW. Гарантирует, что
  # фото >8 МБ из 14-МП снимка сжимается до 1-2 МБ перед загрузкой.
  flutter_image_compress: ^2.4.0
  pin_code_fields: ^9.3.0
  iconsax_plus: ^1.0.0
  shared_preferences: ^2.5.5
  # JWT PocketBase хранится в системном защищённом хранилище: Android
  # Keystore (через EncryptedSharedPreferences) и iOS Keychain. На
  # рутованном Android / iPhone с jailbreak SharedPreferences читается
  # тривиально — туда токен класть нельзя.
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  http: ^1.2.2
  # Прямая зависимость нужна, чтобы явно указывать MediaType для аватаров
  # в multipart-запросах (PocketBase валидирует mime по контенту, без
  # правильного content-type шлёт «invalid mime type»). Транзитивно
  # подтягивается через http, но Dart-анализатор требует явного
  # объявления, как и vector_tile_renderer выше.
  http_parser: ^4.0.2
  geolocator: ^13.0.2
  pocketbase: ^0.22.0
  # Дисковый/memory кэш для удалённых картинок (аватары авторов отзывов,
  # фото к заказам, профильное фото контрагентов). Без кэша Image.network
  # перезапрашивал картинку на каждый ребилд — на ленте отзывов это
  # давало десятки HTTP-запросов на одно открытие экрана.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/ic_launcher.webp"
  adaptive_icon_background: "#1369CD"
  adaptive_icon_foreground: "assets/launcher/ic_launcher.webp"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/
