name: simba
description: "SimbA — Simbioz Active. Поиск и размещение услуг."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.19.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0

  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  iconsax_plus: ^1.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/ic_launcher.png"
  adaptive_icon_background: "#1369CD"
  adaptive_icon_foreground: "assets/launcher/ic_launcher_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
